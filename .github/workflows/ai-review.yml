name: AI Code Review

# ============================================================
# 使用说明：
# 1. 将此文件复制到目标仓库的 .github/workflows/ 目录下
# 2. 在目标仓库的 Settings → Secrets 中添加：
#    - CODE_TOKEN：GitHub Personal Access Token（用于推送日志）
#    - ZHIPU_API_KEY_SECRET：智谱AI API 密钥（格式：apiKey.apiSecret）
# 3. 修改下方 REVIEW_TOOL_REPO 为你的代码审查工具仓库地址
# ============================================================

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    env:
      # ⚠️ 修改为你的代码审查工具仓库地址
      REVIEW_TOOL_REPO: https://gitee.com/qiao-yongheng/ai-code-review.git

    steps:
      - name: Clone code review tool from Gitee
        run: git clone --depth 1 ${{ env.REVIEW_TOOL_REPO }} review-tool

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('review-tool/ai-code-review-init-project/**/pom.xml') }}
          restore-keys: maven-

      - name: Build review service
        run: mvn -B clean package -DskipTests --file review-tool/ai-code-review-init-project/pom.xml

      - name: Start review service
        run: |
          JAR_FILE=$(find review-tool/ai-code-review-init-project/openai-code-review-sdk/target -name "*.jar" -not -name "*sources*" | head -1)
          java -jar "$JAR_FILE" --server &
          echo "Waiting for service to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/status > /dev/null 2>&1; then
              echo "Service is ready"
              break
            fi
            sleep 2
          done
        env:
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
          ZHIPU_API_KEY_SECRET: ${{ secrets.ZHIPU_API_KEY_SECRET }}
          # 使用 H2 内存数据库，无需外部 MySQL
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD:
          SPRING_H2_CONSOLE_ENABLED: true

      - name: Trigger AI review
        id: trigger
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/webhook \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -d '{
              "action": "opened",
              "pull_request": {
                "number": ${{ github.event.pull_request.number }},
                "title": "${{ github.event.pull_request.title }}"
              },
              "repository": {
                "name": "${{ github.event.repository.name }}",
                "owner": {
                  "login": "${{ github.event.repository.owner.login }}"
                }
              }
            }')
          echo "Response: $RESPONSE"
          TASK_ID=$(echo "$RESPONSE" | grep -o '"taskId":"[^"]*"' | cut -d'"' -f4)
          if [ -n "$TASK_ID" ]; then
            echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
            echo "Review task submitted: $TASK_ID"
          else
            echo "::warning::Failed to submit review task"
          fi

      - name: Wait for review completion
        if: steps.trigger.outputs.task_id != ''
        run: |
          TASK_ID="${{ steps.trigger.outputs.task_id }}"
          echo "Waiting for review task: $TASK_ID"
          for i in $(seq 1 60); do
            STATUS_RESPONSE=$(curl -s -X POST http://localhost:8080/api/review/status \
              -H "Content-Type: application/json" \
              -d "{\"taskId\": \"$TASK_ID\"}")
            STATUS=$(echo "$STATUS_RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            echo "Status: $STATUS ($i/60)"
            if [ "$STATUS" = "COMPLETED" ]; then
              echo "Review completed successfully!"
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "::error::Review task failed"
              exit 1
            fi
            sleep 10
          done
          echo "::warning::Review task timed out (10 minutes), but WeChat notification will still be sent if review completes later"
